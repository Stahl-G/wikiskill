<svg xmlns="http://www.w3.org/2000/svg" width="720" height="404" viewBox="0 0 720 404" role="img" aria-label="技能演化循环 — 经验持续积累，验证有效的技能进入下一轮（流程图）">
        <!-- Definitions -->
        <defs>
<style><![CDATA[
svg { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
:root {
      --bg: #020617;
      --grid: #1e293b;
      --text: #ffffff;
      --text-muted: #94a3b8;
      --text-dim: #475569;
      /* UI chrome (menu hints, footer) needs more contrast than SVG .t-dim accents */
      --text-faint: #7d8da1;

      --panel: rgba(15, 23, 42, 0.5);
      --panel-border: #1e293b;
      --lane-fill: rgba(15, 23, 42, 0.22);
      --lane-stroke: #334155;

      --arrow: #64748b;
      --arrow-emphasis: #34d399;

      /* Opaque mask color used behind semi-transparent component fills
         so the arrows drawn underneath are properly hidden. */
      --mask: #0f172a;

      --frontend-fill:    rgba(8, 51, 68, 0.4);
      --frontend-stroke:  #22d3ee;
      --backend-fill:     rgba(6, 78, 59, 0.4);
      --backend-stroke:   #34d399;
      --database-fill:    rgba(76, 29, 149, 0.4);
      --database-stroke:  #a78bfa;
      --cloud-fill:       rgba(120, 53, 15, 0.3);
      --cloud-stroke:     #fbbf24;
      --security-fill:    rgba(136, 19, 55, 0.4);
      --security-stroke:  #fb7185;
      --messagebus-fill:  rgba(251, 146, 60, 0.3);
      --messagebus-stroke:#fb923c;
      --external-fill:    rgba(30, 41, 59, 0.5);
      --external-stroke:  #94a3b8;

      --toolbar-bg:       rgba(15, 23, 42, 0.8);
      --toolbar-border:   #334155;
      --toolbar-text:     #e2e8f0;
      --toolbar-hover:    rgba(15, 23, 42, 0.95);
      --toolbar-menu-bg:  #0f172a;
    }
@media (prefers-color-scheme: light) { :root {
      --bg: #f8fafc;
      --grid: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
      --text-faint: #64748b;

      --panel: #ffffff;
      --panel-border: #e2e8f0;
      --lane-fill: rgba(248, 250, 252, 0.65);
      --lane-stroke: #cbd5e1;

      --arrow: #94a3b8;
      --arrow-emphasis: #059669;

      --mask: #ffffff;

      --frontend-fill:    rgba(34, 211, 238, 0.15);
      --frontend-stroke:  #0891b2;
      --backend-fill:     rgba(52, 211, 153, 0.18);
      --backend-stroke:   #059669;
      --database-fill:    rgba(167, 139, 250, 0.2);
      --database-stroke:  #7c3aed;
      --cloud-fill:       rgba(251, 191, 36, 0.18);
      --cloud-stroke:     #d97706;
      --security-fill:    rgba(251, 113, 133, 0.15);
      --security-stroke:  #e11d48;
      --messagebus-fill:  rgba(251, 146, 60, 0.15);
      --messagebus-stroke:#ea580c;
      --external-fill:    rgba(148, 163, 184, 0.18);
      --external-stroke:  #64748b;

      --toolbar-bg:       rgba(255, 255, 255, 0.92);
      --toolbar-border:   #cbd5e1;
      --toolbar-text:     #334155;
      --toolbar-hover:    #ffffff;
      --toolbar-menu-bg:  #ffffff;
    } }
.c-grid { stroke: var(--grid); fill: none; }
.c-mask { fill: var(--mask); stroke: none; }
.c-frontend { fill: var(--frontend-fill);   stroke: var(--frontend-stroke); }
.c-backend { fill: var(--backend-fill);    stroke: var(--backend-stroke); }
.c-database { fill: var(--database-fill);   stroke: var(--database-stroke); }
.c-cloud { fill: var(--cloud-fill);      stroke: var(--cloud-stroke); }
.c-security { fill: var(--security-fill);   stroke: var(--security-stroke); }
.c-messagebus { fill: var(--messagebus-fill); stroke: var(--messagebus-stroke); }
.c-external { fill: var(--external-fill);   stroke: var(--external-stroke); }
.t-primary { fill: var(--text); }
.t-muted { fill: var(--text-muted); }
.t-dim { fill: var(--text-dim); }
.t-frontend { fill: var(--frontend-stroke); }
.t-backend { fill: var(--backend-stroke); }
.t-database { fill: var(--database-stroke); }
.t-cloud { fill: var(--cloud-stroke); }
.t-security { fill: var(--security-stroke); }
.t-messagebus { fill: var(--messagebus-stroke); }
.t-external { fill: var(--external-stroke); }
.a-default { stroke: var(--arrow); fill: none; }
.a-emphasis { stroke: var(--arrow-emphasis); fill: none; }
.a-security { stroke: var(--security-stroke); fill: none; stroke-dasharray: 5,5; }
.a-dashed { stroke: var(--database-stroke); fill: none; stroke-dasharray: 4,4; }
.m-default { fill: var(--arrow); }
.m-emphasis { fill: var(--arrow-emphasis); }
.m-security { fill: var(--security-stroke); }
.m-dashed { fill: var(--database-stroke); }
.c-security-group { fill: transparent; stroke: var(--security-stroke); stroke-dasharray: 4,4; }
.c-region { fill: rgba(251, 191, 36, 0.05); stroke: var(--cloud-stroke); stroke-dasharray: 8,4; }
.c-lane { fill: var(--lane-fill); stroke: var(--lane-stroke); stroke-dasharray: 6,6; }
.c-bg-rect {fill:var(--bg);}
]]></style>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>
<rect width="100%" height="100%" class="c-bg-rect"/>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Swimlanes -->
        <rect x="40" y="52" width="640" height="104" rx="10" class="c-lane" stroke-width="1"/>
        <text x="54" y="74" class="t-dim" font-size="10" font-weight="600">01 / 整理执行经验</text>

        <rect x="40" y="176" width="640" height="104" rx="10" class="c-lane" stroke-width="1"/>
        <text x="54" y="198" class="t-dim" font-size="10" font-weight="600">02 / 验证并进入下一轮</text>

        <!-- Phase headers -->
        <line x1="42" y1="35" x2="476" y2="35" class="a-dashed" stroke-width="1.1"/>
        <rect x="42" y="27" width="434" height="16" rx="4" class="c-mask"/>
        <text x="259" y="39" class="t-messagebus" font-size="8" font-weight="600" text-anchor="middle">学习</text>
        <line x1="454" y1="35" x2="671" y2="35" class="a-security" stroke-width="1.1"/>
        <rect x="454" y="27" width="217" height="16" rx="4" class="c-mask"/>
        <text x="562.5" y="39" class="t-security" font-size="8" font-weight="600" text-anchor="middle">验证</text>

        <!-- Workflow groups -->


        <!-- Edge paths -->
        <path d="M 136 119 L 250 119" class="a-default" stroke-width="1.4" marker-end="url(#arrowhead)"/>
        <path d="M 350 119 L 380 119" class="a-default" stroke-width="1.4" marker-end="url(#arrowhead)"/>
        <path d="M 480 119 L 570 119" class="a-default" stroke-width="1.4" marker-end="url(#arrowhead)"/>
        <path d="M 625 153 L 625 162.8 L 300 162.8 L 300 209" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 625 153 L 625 170.4 L 500 170.4 L 500 209" class="a-security" stroke-width="1.4" marker-end="url(#arrowhead-security)"/>
        <path d="M 228 243 L 136 243" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 500 277 L 500 284 L 88 284 L 88 269" class="a-dashed" stroke-width="1.4" marker-end="url(#arrowhead-dashed)"/>
        <path d="M 40 243 L 12 243 L 12 119 L 40 119" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>

        <!-- Nodes -->
        <rect x="40" y="93" width="96" height="52" rx="6" class="c-mask"/>
        <rect x="40" y="93" width="96" height="52" rx="6" class="c-frontend" stroke-width="1.5"/>
        <text x="88" y="114" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">执行训练任务</text>
        <text x="88" y="131" class="t-muted" font-size="8" text-anchor="middle">使用当前技能</text>

        <rect x="250" y="93" width="100" height="52" rx="6" class="c-mask"/>
        <rect x="250" y="93" width="100" height="52" rx="6" class="c-database" stroke-width="1.5"/>
        <text x="300" y="114" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">知识维护者</text>
        <text x="300" y="131" class="t-muted" font-size="8" text-anchor="middle">整理经验与模式</text>

        <rect x="380" y="93" width="100" height="52" rx="6" class="c-mask"/>
        <rect x="380" y="93" width="100" height="52" rx="6" class="c-database" stroke-width="1.5"/>
        <text x="430" y="114" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">技能提案者</text>
        <text x="430" y="131" class="t-muted" font-size="8" text-anchor="middle">生成候选技能</text>

        <rect x="570" y="85" width="110" height="68" rx="6" class="c-mask"/>
        <rect x="570" y="85" width="110" height="68" rx="6" class="c-security" stroke-width="1.5"/>
        <text x="625" y="106" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">验证门控</text>
        <text x="625" y="123" class="t-muted" font-size="8" text-anchor="middle">完整验证集评测</text>
        <text x="625" y="141" class="t-security" font-size="7" text-anchor="middle">候选分数高于当前</text>

        <rect x="228" y="209" width="144" height="68" rx="6" class="c-mask"/>
        <rect x="228" y="209" width="144" height="68" rx="6" class="c-backend" stroke-width="1.5"/>
        <text x="300" y="230" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">接受更新</text>
        <text x="300" y="247" class="t-muted" font-size="8" text-anchor="middle">候选分数更高</text>
        <text x="300" y="265" class="t-backend" font-size="7" text-anchor="middle">下一轮使用新技能</text>

        <rect x="40" y="217" width="96" height="52" rx="6" class="c-mask"/>
        <rect x="40" y="217" width="96" height="52" rx="6" class="c-frontend" stroke-width="1.5"/>
        <text x="88" y="238" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">下一轮</text>
        <text x="88" y="255" class="t-muted" font-size="8" text-anchor="middle">技能迭代 · 知识积累</text>

        <rect x="422" y="209" width="156" height="68" rx="6" class="c-mask"/>
        <rect x="422" y="209" width="156" height="68" rx="6" class="c-security" stroke-width="1.5"/>
        <text x="500" y="230" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">拒绝更新</text>
        <text x="500" y="247" class="t-muted" font-size="8" text-anchor="middle">分数持平或下降</text>
        <text x="500" y="265" class="t-security" font-size="7" text-anchor="middle">保留旧技能与学习经验</text>

        <!-- Edge labels -->



        <rect x="438.8" y="149" width="48.4" height="14" rx="3" class="c-mask"/>
        <text x="463" y="159" class="t-backend" font-size="8" text-anchor="middle">分数提高</text>
        <rect x="534" y="157" width="58" height="14" rx="3" class="c-mask"/>
        <text x="563" y="167" class="t-security" font-size="8" text-anchor="middle">持平或下降</text>




        <!-- Legend -->
        <text x="175" y="304" class="t-primary" font-size="10" font-weight="600">图例</text>
        <rect x="175" y="316" width="14" height="9" rx="2" class="c-frontend" stroke-width="1"/>
        <text x="195" y="324" class="t-muted" font-size="7">任务执行</text>
        <rect x="260" y="316" width="14" height="9" rx="2" class="c-backend" stroke-width="1"/>
        <text x="280" y="324" class="t-muted" font-size="7">技能更新</text>
        <rect x="370" y="316" width="14" height="9" rx="2" class="c-security" stroke-width="1"/>
        <text x="390" y="324" class="t-muted" font-size="7">验证判断</text>
        <rect x="455" y="316" width="14" height="9" rx="2" class="c-messagebus" stroke-width="1"/>
        <text x="475" y="324" class="t-muted" font-size="7">学习阶段</text>
        <rect x="565" y="316" width="14" height="9" rx="2" class="c-database" stroke-width="1"/>
        <text x="585" y="324" class="t-muted" font-size="7">经验知识</text>
      </svg>
